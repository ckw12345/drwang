name: Replace Old Links
on:
  workflow_dispatch:

jobs:
  replace-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Run replace old links
        run: python replace_old_links.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html case-reports.html
          git commit -m "Updated internal case report links"
          git push
