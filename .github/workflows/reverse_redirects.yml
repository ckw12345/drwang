name: Reverse Add Redirects

on:
  workflow_dispatch:

jobs:
  reverse-redirects:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install beautifulsoup4 lxml

      - name: Run reverse redirect script
        run: python reverse_add_redirects.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add casereports/*.html
          git add reverse_redirect_log.txt
          git commit -m "Added reverse redirects from origin mapping" || echo "No changes"
          git push
