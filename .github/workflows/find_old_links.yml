name: Find Old Case Report Links

on:
  workflow_dispatch:

jobs:
  find-links:
    runs-on: ubuntu-latest
    steps:
      # Checkout code
      - uses: actions/checkout@v4

      # Setup Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Run Python script
      - name: Run find_old_links.py
        run: python find_old_links.py

      # Commit log file (optional)
      - name: Commit log
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add old_links_log.txt || echo "No log generated"
          git commit -m "Generated old links log" || echo "No changes to commit"
          git push
