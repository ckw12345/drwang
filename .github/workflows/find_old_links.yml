name: Find Old CaseReport Links

on:
  workflow_dispatch:

jobs:
  find-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install beautifulsoup4 lxml

      # ✅ FIXED HERE
      - name: Run script
        run: python find_old_casereport_links.py

      - name: Commit log to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add old_casereport_links_log.txt
          git commit -m "Generated links log" || echo "No changes"
          git push
