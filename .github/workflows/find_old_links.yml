name: Find Old CaseReport Links

on:
  workflow_dispatch:

jobs:
  find-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Run script
        run: python find_old_links.py

      - name: Upload log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: old-casereport-links-log
          path: old_casereport_links_log.txt
