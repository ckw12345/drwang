name: Remove Refresh Meta

on:
  push:
    paths:
      - '**/acupuncture-for*.html'   # only trigger when these pages change
    branches:
      - main                        # or your default branch

jobs:
  remove-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run script
        run: python remove_refresh.py
