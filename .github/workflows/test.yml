name: Test Recent Page

on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Force Node.js 24 to remove deprecation warning

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # Setup Python
      # -----------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------
      # Install dependencies (forced upgrade + cache)
      # -----------------------------
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      # -----------------------------
      # Run the Python script
      # -----------------------------
      - name: Run script
        run: python test_recent_page.py

      # -----------------------------
      # Commit generated output (optional)
      # -----------------------------
      - name: Commit output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Generated test output page" || echo "No changes"
          git push
