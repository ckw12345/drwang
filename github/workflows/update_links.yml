name: Update Case Report Links
on:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Run link replacement script
        run: python find_old_casereport_links.py

      - name: Commit updated links
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html case-reports.html link_replacements.log
          git commit -m "Update case report links to new HTMLs" || echo "No changes"
          git push
